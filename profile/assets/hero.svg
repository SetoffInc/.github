<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" width="880" height="476" role="img">
<title>setoff: an agent reconciles a quarter and the books balance</title>
<style>
text { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 15px; white-space: pre; }
.l { opacity: 0; animation: in .01s linear forwards; }
.type { animation: type 1.8s steps(42, end) .4s forwards; }
.cursor { animation: in .01s linear forwards, blink 1.1s steps(1, end) infinite; }
@keyframes in { to { opacity: 1; } }
@keyframes type { to { transform: translateX(378px); } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .l, .cursor { animation: none; opacity: 1; }
  .type { display: none; }
}
</style>
<rect width="880" height="476" rx="14" fill="#0F1B2D"/>
<g stroke="#1F3350" stroke-width="1" opacity=".55"><line x1="0" y1="34" x2="880" y2="34"/><line x1="0" y1="62" x2="880" y2="62"/><line x1="0" y1="90" x2="880" y2="90"/><line x1="0" y1="118" x2="880" y2="118"/><line x1="0" y1="146" x2="880" y2="146"/><line x1="0" y1="174" x2="880" y2="174"/><line x1="0" y1="202" x2="880" y2="202"/><line x1="0" y1="230" x2="880" y2="230"/><line x1="0" y1="258" x2="880" y2="258"/><line x1="0" y1="286" x2="880" y2="286"/><line x1="0" y1="314" x2="880" y2="314"/><line x1="0" y1="342" x2="880" y2="342"/><line x1="0" y1="370" x2="880" y2="370"/><line x1="0" y1="398" x2="880" y2="398"/><line x1="0" y1="426" x2="880" y2="426"/><line x1="0" y1="454" x2="880" y2="454"/></g>
<g stroke="#F06A5D" stroke-width="1" opacity=".5"><line x1="20" y1="0" x2="20" y2="476"/><line x1="24" y1="0" x2="24" y2="476"/></g>
<text x="40" y="78" fill="#E6EDF5" style="font-size:46px;font-weight:700;letter-spacing:-1px">setoff</text>
<g stroke="#F5B841" stroke-width="2"><line x1="40" y1="92" x2="206" y2="92"/><line x1="40" y1="98" x2="206" y2="98"/></g>
<text x="236" y="64" fill="#E6EDF5">agents for tax work.</text>
<text x="236" y="88" fill="#8BA3BF">every entry balances, or it does not post.</text>
<rect x="40" y="140" width="800" height="316" rx="10" fill="#0A1322" stroke="#1F3350"/>
<g fill="#1F3350"><circle cx="62" cy="160" r="5"/><circle cx="80" cy="160" r="5"/><circle cx="98" cy="160" r="5"/></g>
<text x="440" y="165" fill="#8BA3BF" text-anchor="middle" style="font-size:13px">~/ledger</text>
<text x="64" y="204"><tspan fill="#F5B841">$ </tspan><tspan fill="#E6EDF5">protas reconcile --period 2026-Q3 --as you</tspan></text>
<clipPath id="term"><rect x="41" y="141" width="798" height="314" rx="9"/></clipPath>
<rect class="type" clip-path="url(#term)" x="82" y="188" width="382" height="22" fill="#0A1322"/>
<text class="l" style="animation-delay:2.6s" x="64" y="228"><tspan fill="#4CC38A">  scope   </tspan><tspan fill="#E6EDF5">snapshot of your permissions, your clients only</tspan></text>
<text class="l" style="animation-delay:3.2s" x="64" y="252"><tspan fill="#4CC38A">  fetch   </tspan><tspan fill="#E6EDF5">12,408 bank lines, 11,937 ledger entries</tspan></text>
<text class="l" style="animation-delay:3.7s" x="64" y="276"><tspan fill="#4CC38A">  match   </tspan><tspan fill="#E6EDF5">11,902 exact, 471 fuzzy, 35 need a human</tspan></text>
<text class="l" style="animation-delay:4.2s" x="64" y="300"><tspan fill="#F5B841">  ask     </tspan><tspan fill="#E6EDF5">approve 35 proposals? </tspan><tspan fill="#F5B841">y</tspan><tspan fill="#8BA3BF">  approved by you</tspan></text>
<text class="l" style="animation-delay:4.8s" x="64" y="324"><tspan fill="#4CC38A">  post    </tspan><tspan fill="#E6EDF5">journal 2026-Q3-0412</tspan></text>
<text class="l" style="animation-delay:5.7s" x="64" y="372"><tspan fill="#F06A5D">  debits    </tspan><tspan fill="#E6EDF5">4,812,330.17</tspan></text>
<text class="l" style="animation-delay:6.0s" x="64" y="396"><tspan fill="#4CC38A">  credits   </tspan><tspan fill="#E6EDF5">4,812,330.17</tspan></text>
<g class="l" style="animation-delay:6.4s" stroke="#F5B841" stroke-width="1.5"><line x1="172.0" y1="404" x2="280.0" y2="404"/><line x1="172.0" y1="408" x2="280.0" y2="408"/></g>
<text class="l" style="animation-delay:6.7s" x="64" y="430"><tspan fill="#F5B841">  Δ         </tspan><tspan fill="#F5B841">0.00</tspan><tspan fill="#8BA3BF">   balanced</tspan></text>
<rect class="l cursor" style="animation-delay:6.7s,6.7s" x="313" y="416" width="9" height="18" fill="#F5B841"/>
</svg>
